<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Grammar Mastery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: race-day board. Teacher = join panel + live lanes; student = one question card at a time with a progress track on top. */
/* Layout: bright game-show board. Teacher = join panel + live lanes; student = one big colourful question card with four answer tiles. */
:root{
  --bg:#FFF7EC; --surface:#FFFFFF; --ink:#1C1640; --muted:#655E85; --line:#EADFF5;
  --pink:#FF3D8B; --sky:#1E9BFF; --sun:#FFB800; --mint:#13B88A; --violet:#7A4DFF; --tang:#FF6B2C;
  --accent:#FF3D8B; --accent-ink:#FFFFFF; --track:#F0E6FA;
  --o1:#F23B5B; --o2:#1E7BFF; --o3:#F2A100; --o4:#12A574; --oink:#FFFFFF;
  --good:#0E9B6E; --good-bg:#DBF7EC; --bad:#D9363E; --bad-bg:#FFE6E8; --warn:#A86B00; --warn-bg:#FFF1CC;
  --display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17112E; --surface:#231B45; --ink:#F7F3FF; --muted:#B5ABD6; --line:#3A2F69;
  --pink:#FF5C9E; --sky:#4DB2FF; --sun:#FFC933; --mint:#33D6A6; --violet:#9B7BFF; --tang:#FF8650;
  --accent:#FF5C9E; --accent-ink:#1A0B14; --track:#33295E;
  --o1:#E8475F; --o2:#2F7FF0; --o3:#E09A00; --o4:#14996D; --oink:#FFFFFF;
  --good:#38DDA8; --good-bg:#123D33; --bad:#FF7A80; --bad-bg:#46202A; --warn:#FFCF5C; --warn-bg:#40330F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17112E; --surface:#231B45; --ink:#F7F3FF; --muted:#B5ABD6; --line:#3A2F69;
  --pink:#FF5C9E; --sky:#4DB2FF; --sun:#FFC933; --mint:#33D6A6; --violet:#9B7BFF; --tang:#FF8650;
  --accent:#FF5C9E; --accent-ink:#1A0B14; --track:#33295E;
  --o1:#E8475F; --o2:#2F7FF0; --o3:#E09A00; --o4:#14996D; --oink:#FFFFFF;
  --good:#38DDA8; --good-bg:#123D33; --bad:#FF7A80; --bad-bg:#46202A; --warn:#FFCF5C; --warn-bg:#40330F; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);
  background-image:radial-gradient(circle at 8% 6%,color-mix(in srgb,var(--pink) 16%,transparent) 0 180px,transparent 181px),radial-gradient(circle at 96% 18%,color-mix(in srgb,var(--sky) 16%,transparent) 0 150px,transparent 151px),radial-gradient(circle at 88% 92%,color-mix(in srgb,var(--sun) 20%,transparent) 0 200px,transparent 201px),radial-gradient(circle at 4% 80%,color-mix(in srgb,var(--mint) 14%,transparent) 0 140px,transparent 141px);background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(30px,5.4vw,48px);font-weight:700;letter-spacing:-.01em}
.rainbow{background:linear-gradient(90deg,var(--pink),var(--tang),var(--sun),var(--mint),var(--sky),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:22px;font-weight:700}
.eyebrow{font:700 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:linear-gradient(135deg,var(--pink),var(--tang));color:#fff;font:700 18px var(--display);padding:12px 24px;border-radius:16px;box-shadow:0 4px 0 color-mix(in srgb,var(--pink) 60%,#000);transition:transform .12s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.flag{display:inline-block;width:22px;height:16px;vertical-align:-2px;margin-right:8px;border-radius:2px;
  background:conic-gradient(var(--ink) 25%,var(--surface) 0 50%,var(--ink) 0 75%,var(--surface) 0) 0 0/8px 8px;border:1px solid var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--track);font-weight:700;font-size:14px}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.banner{padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-weight:700;font-size:14px}

/* --- join / lobby --- */
.center{min-height:70vh;display:grid;place-items:center}
.joinbox{width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px;text-align:left}
.joinbox input{font:700 20px var(--body);padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.waiting{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.lights{display:flex;gap:10px}
.lights i{width:22px;height:22px;border-radius:50%;background:var(--track);animation:light 2.4s infinite}
.lights i:nth-child(2){animation-delay:.4s}.lights i:nth-child(3){animation-delay:.8s}
@keyframes light{0%,60%,100%{background:var(--track)}20%,40%{background:var(--accent)}}

/* --- student play --- */
.hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.track{position:relative;height:14px;background:var(--track);border-radius:999px;overflow:visible}
.track .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--pink),var(--sun),var(--mint));border-radius:999px;transition:width .5s}
.track .car{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:22px;transition:left .5s;line-height:1}
.score{font:700 26px var(--display);color:var(--pink);font-variant-numeric:tabular-nums}
.qcard{display:flex;flex-direction:column;gap:18px}
.qtag{align-self:flex-start}
.qtext{font:600 clamp(22px,3.8vw,32px)/1.3 var(--display)}
.qcard{position:relative;overflow:hidden;padding-top:28px}.qcard::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:linear-gradient(90deg,var(--pink),var(--sun),var(--mint),var(--sky),var(--violet))}
.qtext .blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--accent);height:1em;vertical-align:baseline}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{--oc:var(--o1);display:flex;gap:12px;align-items:center;text-align:left;padding:16px 18px;background:var(--oc);color:var(--oink);border:0;border-radius:18px;font:700 19px var(--body);min-height:70px;box-shadow:0 5px 0 color-mix(in srgb,var(--oc) 65%,#000);transition:transform .12s, box-shadow .12s}
.opt:nth-child(2){--oc:var(--o2)}.opt:nth-child(3){--oc:var(--o3)}.opt:nth-child(4){--oc:var(--o4)}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--oc) 65%,#000)}
.opt b{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.22);font:700 20px var(--display);color:#fff}
.opt:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 8px 0 color-mix(in srgb,var(--oc) 65%,#000)}
.opt.wrong{background:var(--track);color:var(--muted);text-decoration:line-through;box-shadow:none;opacity:.75}
.opt.wrong b::after{content:"✕"}.opt.wrong b{font-size:0;background:var(--bad)}.opt.wrong b::after{font-size:20px}
.opt.right{--oc:var(--good);background:var(--good);color:#fff;animation:bounce .6s}
.opt.right b{font-size:0}.opt.right b::after{content:"✓";font-size:22px}
.opts:has(.right) .opt:not(.right){opacity:.35}
@keyframes bounce{30%{transform:scale(1.06)}60%{transform:scale(.98)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.04)}}
.fb{border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.fb.good{background:var(--good-bg);border:2px solid var(--good)}
.fb.bad{background:var(--warn-bg);border:2px dashed var(--warn)}
.fb.bad .head{color:var(--warn)!important}
.hint{display:flex;gap:12px;align-items:flex-start;font-size:17px;line-height:1.5}
.hint .bulb{font-size:30px;line-height:1;animation:wiggle 1.2s infinite}
.hint em{font-style:normal;font-weight:700;background:color-mix(in srgb,var(--sun) 35%,transparent);padding:0 4px;border-radius:4px}
@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.hintlvl{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--warn)}
.fb .head{font:800 22px var(--display)}
.fb.good .head{color:var(--good)} .fb.bad .head{color:var(--bad)}
.fb .rule{font-size:16px}
.fb .rule em{font-style:normal;font-weight:700}
.fbrow{display:flex;justify-content:flex-end}
.done{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.trophy{font-size:72px;line-height:1}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* --- teacher --- */
.tgrid{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
@media (max-width:820px){.tgrid{grid-template-columns:1fr}}
.joinpanel{display:flex;flex-direction:column;gap:14px;align-items:stretch}
#qr{display:grid;place-items:center;background:#fff;padding:12px;border-radius:12px;align-self:center}
#qr img,#qr canvas{display:block;width:240px;height:240px}
.link{font:700 13px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;background:var(--bg);padding:10px;border-radius:8px;border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bigcount{font:800 56px/1 var(--display);font-variant-numeric:tabular-nums}
.lobby{display:flex;flex-wrap:wrap;gap:8px}
.lobby .chip{animation:pop .4s}
.board{display:flex;flex-direction:column;gap:16px;min-width:0}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:560px){.summary{grid-template-columns:repeat(2,1fr)}}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sum .n{font:800 28px var(--display);font-variant-numeric:tabular-nums}
.lanes{display:flex;flex-direction:column;gap:2px}
.lane{display:grid;grid-template-columns:minmax(90px,150px) 1fr 70px;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line)}
.lane .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lane .pts{text-align:right;font:800 18px var(--display);font-variant-numeric:tabular-nums}
.lane.stuck .nm::after{content:" ⚑";color:var(--bad)}
.lane.fin .track .fill{background:var(--good)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.heat div{aspect-ratio:1;max-width:100%;border-radius:6px;display:grid;place-items:center;font:700 12px var(--body);background:var(--track);color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20}
.seclist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.track .tick{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1px;background:var(--surface);border-radius:2px}
.secintro{display:flex;flex-direction:column;gap:14px;padding:28px}
.secrule{font:700 18px/1.4 var(--display);padding:14px 16px;border-radius:12px;background:var(--bg);border:2px dashed var(--line)}
.secheat{display:flex;flex-direction:column;gap:12px}
.sh{display:flex;flex-direction:column;gap:6px}
.sh .heat{grid-template-columns:repeat(5,minmax(0,52px))}
.credit{max-width:1080px;margin:28px auto 0;padding-top:14px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:14px;font-weight:700}
.edsec{display:flex;flex-direction:column;gap:14px}
.edhead{display:flex;flex-direction:column;gap:10px}
.fgrid{display:grid;grid-template-columns:2fr 1fr;gap:10px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font:700 12px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld textarea,.optrow input:not([type=radio]){font:16px/1.4 var(--body);padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box;resize:vertical}
.fld input:focus,.fld textarea:focus,.optrow input:focus{border-color:var(--accent);outline:none}
.qlist{display:flex;flex-direction:column;gap:8px}
.qrow{border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.qrow.open{border-color:var(--accent)}
.qsum{width:100%;display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:12px;background:transparent;color:var(--ink);text-align:left}
.qn{font:800 15px var(--display);color:var(--accent)}
.qprev{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qans{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.qans{display:none}}
.caret{color:var(--muted);font-size:12px}
.qedit{display:flex;flex-direction:column;gap:12px;padding:0 12px 14px}
.optrow{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center}
.optrow input[type=radio]{width:22px;height:22px;accent-color:var(--good)}
.mini{background:var(--surface);color:var(--ink);border:2px solid var(--line);padding:7px 12px;font:700 14px var(--body);border-radius:10px}
.mini:disabled{opacity:.4;cursor:not-allowed}
.mini.add{align-self:flex-start;border-style:dashed}
.mini.danger{color:var(--bad);border-color:var(--bad)}
.qacts{gap:8px}
.savebar{position:sticky;bottom:0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:5}
.pvbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pvsec{display:flex;flex-direction:column;gap:10px;border-style:dashed}
.pvnav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.revbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.revdots{display:flex;gap:6px;margin-left:auto}
.revdots i{width:12px;height:12px;border-radius:50%;background:var(--track);border:2px solid var(--warn)}
.revdots i.on{background:var(--good);border-color:var(--good)}
#cheer{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:15}
#cheer .burst{display:flex;flex-direction:column;align-items:center;gap:6px;animation:burst 1.4s ease-out forwards}
#cheer .em{font-size:clamp(84px,18vw,140px);line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.12))}
#cheer .tx{font:700 clamp(28px,6vw,46px) var(--display);color:#fff;padding:6px 22px;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--tang));box-shadow:0 5px 0 color-mix(in srgb,var(--pink) 60%,#000)}
#cheer .tx.soft{background:linear-gradient(90deg,var(--sky),var(--violet));box-shadow:0 5px 0 color-mix(in srgb,var(--violet) 60%,#000)}
@keyframes burst{0%{transform:scale(.3);opacity:0}18%{transform:scale(1.12);opacity:1}30%{transform:scale(1)}80%{opacity:1}100%{transform:scale(1.05) translateY(-30px);opacity:0}}
.streak{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:999px;background:linear-gradient(90deg,var(--tang),var(--sun));color:#fff;font:700 15px var(--display);animation:pop .5s}
.mute{background:var(--surface);border:2px solid var(--line);border-radius:12px;width:42px;height:42px;font-size:20px}
.scorebox{display:flex;align-items:center;gap:10px}
.floatpts{position:fixed;font:700 30px var(--display);color:var(--pink);pointer-events:none;z-index:16;animation:floatup 1s ease-out forwards}
@keyframes floatup{to{transform:translateY(-80px);opacity:0}}
.autorow{align-items:center;gap:14px}
.autobar{flex:1;height:8px;border-radius:999px;background:color-mix(in srgb,var(--good) 20%,transparent);overflow:hidden}
.autobar i{display:block;height:100%;width:100%;background:var(--good);border-radius:999px;transform-origin:left;animation:drain linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.hintscreen{display:flex;flex-direction:column;gap:18px;padding:28px;border:3px dashed var(--warn);background:var(--surface)}
.hshead{display:flex;gap:14px;align-items:center}
.hsem{font-size:56px;line-height:1;animation:wiggle 1.2s infinite}
.hshead h2{font-size:clamp(22px,4vw,30px);color:var(--warn)}
.chose{align-self:flex-start;padding:6px 14px;border-radius:999px;background:var(--bad-bg);color:var(--bad);font-weight:700}
.hsbody{font:500 clamp(20px,3.4vw,26px)/1.5 var(--display);padding:18px 20px;border-radius:16px;background:var(--warn-bg)}
.hsbody em{font-style:normal;font-weight:700;background:color-mix(in srgb,var(--sun) 45%,transparent);padding:0 6px;border-radius:6px}
.hsfoot{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.readbar{height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.readbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--tang));transform-origin:left;animation:fillup linear forwards}
@keyframes fillup{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#und{align-self:center;min-width:260px}
.donewrap{display:flex;flex-direction:column;gap:18px;max-width:720px;margin:0 auto;width:100%}
.congrats{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 20px}
.dtitle{font-size:clamp(20px,3.6vw,26px);color:var(--violet)}
.bigpts{display:flex;align-items:baseline;gap:8px;font:700 clamp(56px,12vw,84px)/1 var(--display);color:var(--pink);font-variant-numeric:tabular-nums}
.bigpts small{font-size:22px;color:var(--muted)}
.stars{display:flex;gap:8px;font-size:46px;line-height:1}
.stars span{color:var(--track);opacity:0;animation:starpop .5s forwards}
.stars span.on{color:var(--sun);text-shadow:0 3px 0 color-mix(in srgb,var(--sun) 50%,#000)}
@keyframes starpop{0%{opacity:0;transform:scale(.2) rotate(-40deg)}70%{opacity:1;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
.dline{margin:0;max-width:52ch;font-size:17px}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.badge{display:inline-flex;gap:6px;align-items:center;padding:6px 14px;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--sky) 18%,var(--surface)),color-mix(in srgb,var(--violet) 18%,var(--surface)));border:2px solid color-mix(in srgb,var(--violet) 35%,transparent);font-weight:700}
.secbars{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.sbar{display:flex;flex-direction:column;gap:6px}
.sbtrack{height:12px;border-radius:999px;background:var(--track);overflow:hidden}
.sbtrack i{display:block;height:100%;border-radius:999px}
.strugs{display:flex;flex-direction:column;gap:12px}
.strug{border:2px solid var(--line);border-left:6px solid var(--sun);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.sq{font:600 19px/1.4 var(--display)}
.sq .gap{color:var(--muted)}
.sline{font-weight:700}.sline.bad{color:var(--bad)}.sline.good{color:var(--good)}

<body>

<canvas id="confetti"></canvas>
<div id="cheer" hidden aria-live="polite"></div>
<div class="wrap" id="app"></div>
<footer class="credit">Created by: Maha Aldosari</footer>
<div class="toast" id="toast" hidden></div>

<script>
/* Grammar Mastery · live classroom adapter for GitHub Pages (Firebase Realtime Database).
   Teacher: open  …/#teacher      Students: scan the QR / open the join link (…/#j=PIN…)  */
(function(){
"use strict";
var EMBED_CFG = null; /*__EMBED_CFG__*/
var FB_V = "10.12.2";
var RULES = '{\n  "rules": {\n    "games": {\n      "$pin": {\n        ".read": "auth != null",\n        "host": { ".write": "auth != null && (!data.exists() || data.val() === auth.uid)" },\n        "meta": { ".write": "auth != null && root.child(\'games\').child($pin).child(\'host\').val() === auth.uid" },\n        "races": { ".write": "auth != null && root.child(\'games\').child($pin).child(\'host\').val() === auth.uid" },\n        "players": { "$uid": { ".write": "auth != null && auth.uid === $uid" } },\n        "lobby": { "$uid": { ".write": "auth != null && auth.uid === $uid" } }\n      }\n    }\n  }\n}';
var LS = {
  get: function(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set: function(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del: function(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function b64e(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64d(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4)s+="="; return decodeURIComponent(escape(atob(s))); }

var hash = location.hash.replace(/^#/,"");
var params = new URLSearchParams(hash.indexOf("=")>=0 ? hash : "");
var isTeacher = /^teacher/.test(hash);
var wantSetup = /^teacher-setup/.test(hash);
var pin = params.get("j");
window.addEventListener("hashchange", function(){ location.reload(); });

var cfg = EMBED_CFG;
if(!cfg && params.get("k")){
  try{ var c = JSON.parse(b64d(params.get("k")));
    cfg = {apiKey:c.a, authDomain:c.p+".firebaseapp.com", databaseURL:c.d, projectId:c.p}; if(c.i)cfg.appId=c.i;
  }catch(e){ cfg = null; }
}
if(!cfg) cfg = LS.get("gm-fbcfg");

if(isTeacher && (!cfg || wantSetup)){
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", showSetup); else showSetup();
  return;
}
if(!(isTeacher || pin) || !cfg) return;                 /* plain link → practice mode */
if(pin && !/^\d{6}$/.test(pin)) return;

if(isTeacher){ pin = LS.get("gm-pin"); if(!pin){ pin = String(100000 + Math.floor(Math.random()*900000)); LS.set("gm-pin", pin); } }
var base = location.origin + location.pathname;
var k = EMBED_CFG ? "" : "&k=" + b64e(JSON.stringify({a:cfg.apiKey, d:cfg.databaseURL, p:cfg.projectId, i:cfg.appId||""}));
window.__JOIN_URL = base + "#j=" + pin + k;
window.__PIN = pin;
window.__GH_LIVE = true;

/* ---------- keep state across a page reload (stands in for the Claude viewer's hot reload) ---------- */
var HK = "gm-hot-" + (isTeacher ? "t" : "s") + "-" + pin;
var stored = LS.get(HK);
if(stored && (Date.now() - (stored.t||0) > 6*3600*1000)) stored = null;
var snapFn = null;
function saveHot(){ if(!snapFn) return; try{ var d = snapFn();
  LS.set(HK, isTeacher ? {t:Date.now(), H:d.H, E:d.E, dirty:d.dirty} : {t:Date.now(), S:d.S}); }catch(e){} }
setInterval(saveHot, 2000);
addEventListener("pagehide", saveHot);
document.addEventListener("visibilitychange", saveHot);
var hot = { data: stored || {}, snapshot: function(fn){ snapFn = fn; } };

/* ---------- Firebase ---------- */
function loadScript(u){ return new Promise(function(res,rej){ var s=document.createElement("script"); s.src=u; s.onload=res; s.onerror=function(){ rej(new Error("Couldn't load Firebase. Check the internet connection.")); }; document.head.appendChild(s); }); }
var uid = null, G = null, fdb = null, ready = null;
function start(){
  if(ready) return ready;
  ready = (async function(){
    for(var n of ["app","auth","database"]) await loadScript("https://www.gstatic.com/firebasejs/"+FB_V+"/firebase-"+n+"-compat.js");
    firebase.initializeApp(cfg);
    var auth = firebase.auth();
    var u = await new Promise(function(r){ var un = auth.onAuthStateChanged(function(x){ un(); r(x); }); });
    if(!u){ try{ u = (await auth.signInAnonymously()).user; }
      catch(e){ throw new Error("Anonymous sign-in is off. In Firebase: Authentication → Sign-in method → Anonymous → Enable."); } }
    uid = u.uid;
    fdb = firebase.database();
    G = fdb.ref("games/" + pin);
    if(isTeacher){
      var h;
      try{ h = (await G.child("host").once("value")).val(); }
      catch(e){ throw new Error("The database refused access. Check the Realtime Database rules (paste the rules from the setup page)."); }
      if(h && h !== uid){ LS.del("gm-pin"); LS.del(HK); location.reload(); await new Promise(function(){}); }
      if(!h) await G.child("host").set(uid);
    }
    wireConnection();
    return true;
  })();
  ready.catch(function(e){ window.__LIVE_ERR = (e && e.message) || "Couldn't connect to the live class."; });
  return ready;
}
function withTimeout(p, ms){ return Promise.race([p, new Promise(function(_,rej){ setTimeout(function(){ rej(new Error("The live class didn't answer. Check the internet connection and the Firebase settings.")); }, ms); })]); }

/* ---------- connection + presence ---------- */
var connected = false, connListeners = [], myPresence = null;
function wireConnection(){
  fdb.ref(".info/connected").on("value", function(s){
    connected = !!s.val();
    if(connected && myPresence) writePresence(true);
    connListeners.forEach(function(f){ try{ f(connected); }catch(e){} });
  });
}
function lobbySummary(p){ return {role:p.role||"", gid:p.gid==null?"":p.gid, score:+p.score||0, done:!!p.done}; }
var lastWritten = "";
function writePresence(force){
  if(!G || !uid || !myPresence) return;
  var full = JSON.stringify(myPresence);
  if(!force && full === lastWritten) return;
  lastWritten = full;
  var me = G.child("players/"+uid), lb = G.child("lobby/"+uid);
  if(myPresence.role !== "player"){ me.remove(); lb.remove(); return; }
  me.onDisconnect().remove(); lb.onDisconnect().remove();
  me.set({d: full, t: firebase.database.ServerValue.TIMESTAMP});
  lb.set(lobbySummary(myPresence));
}

/* peers: the teacher sees every player's full progress; a student only sees small score summaries */
var peerMap = {}, peerListeners = [], peersArr = Object.freeze([]), pending = {joined:[], left:[], updated:[]}, flushT = null, firstFlush = true;
function makePeer(id, presence, t){ return Object.freeze({peer:id, by:id, isMe:id===uid, sameTab:id===uid, kind:"viewer", guest:false, presence:Object.freeze(presence||{}), updatedAt:t||Date.now()}); }
function flush(){
  flushT = null;
  peersArr = Object.freeze(Object.keys(peerMap).map(function(id){ return peerMap[id]; }));
  var ch = {peers:peersArr, joined:Object.freeze(pending.joined), left:Object.freeze(pending.left), updated:Object.freeze(pending.updated)};
  if(firstFlush){ ch.joined = peersArr; firstFlush = false; }
  pending = {joined:[], left:[], updated:[]};
  peerListeners.forEach(function(f){ try{ f(ch); }catch(e){ console.error(e); } });
}
function queue(){ if(!flushT) flushT = setTimeout(flush, 60); }
var peersWired = false;
function wirePeers(){
  if(peersWired) return; peersWired = true;
  var ref = G.child(isTeacher ? "players" : "lobby");
  function parse(s){ var v = s.val(); if(!v) return {};
    if(isTeacher){ try{ return JSON.parse(v.d); }catch(e){ return {}; } }
    return {role:v.role, gid:v.gid===""?null:v.gid, score:v.score, done:v.done}; }
  ref.on("child_added", function(s){ var p = makePeer(s.key, parse(s)); peerMap[s.key] = p; pending.joined.push(p); queue(); });
  ref.on("child_changed", function(s){ var p = makePeer(s.key, parse(s)); peerMap[s.key] = p; pending.updated.push(p); queue(); });
  ref.on("child_removed", function(s){ var p = peerMap[s.key]; delete peerMap[s.key]; if(p) pending.left.push(p); queue(); });
  setTimeout(function(){ if(firstFlush) flush(); }, 1200);
}

var room = {
  peers: function(){ return peersArr; },
  onPeers: function(fn){ peerListeners.push(fn); wirePeers(); return function(){ peerListeners = peerListeners.filter(function(f){ return f!==fn; }); }; },
  presence: function(patch){ myPresence = Object.assign({}, myPresence || {}, patch);
    Object.keys(myPresence).forEach(function(k){ if(myPresence[k] === null) delete myPresence[k]; });
    writePresence(false); return Promise.resolve(); },
  emit: function(topic, data){ if(!isTeacher || topic !== "game") return Promise.resolve();
    var v = JSON.stringify(data); if(v === room._lastGame) return Promise.resolve(); room._lastGame = v;
    return G.child("meta/game").set(v).catch(function(){}); },
  on: function(topic, fn){ if(topic !== "game") return function(){};
    var cb = function(s){ var v = s.val(); if(!v) return; try{ fn({topic:"game", data:JSON.parse(v), peer:"", by:null, isMe:false, sameTab:false, kind:"viewer", guest:false}); }catch(e){ console.error(e); } };
    G.child("meta/game").on("value", cb); return function(){ G.child("meta/game").off("value", cb); }; },
  connected: function(){ return connected; },
  onConnection: function(fn){ connListeners.push(fn); setTimeout(function(){ fn(connected); }, 0); return function(){ connListeners = connListeners.filter(function(f){ return f!==fn; }); }; },
  canSendToClaudeSession: function(){ return Promise.resolve("off"); }
};
var user = {
  canEdit: function(){ return Promise.resolve(isTeacher); },
  isOwner: function(){ return Promise.resolve(isTeacher); },
  can: function(){ return Promise.resolve(null); },
  id: function(){ return Promise.resolve(uid); },
  me: function(){ return Promise.resolve({id:uid, name:"", avatarUrl:"", color:"#888", email:null, isOwner:isTeacher, canEdit:isTeacher}); },
  profiles: function(ids){ var o = {}; [].concat(ids||[]).forEach(function(i){ o[i] = {id:i, name:"", avatarUrl:"", color:"#888", email:null, isMe:i===uid, guest:false}; }); return Promise.resolve(o); },
  search: function(){ return Promise.resolve([]); }
};
/* documents the page uses: quiz/questions (edited questions) and races/<id> (saved reports) */
function pathRef(path){ var p = path.split("/");
  if(p[0]==="quiz" && p[1]==="questions") return G.child("meta/questions");
  if(p[0]==="races" && p[1]) return G.child("races/" + p[1].replace(/[^A-Za-z0-9_-]/g,""));
  return null; }
var db = {
  doc: function(path){ var ref = pathRef(path);
    return {
      id: path.split("/").pop(), path: path,
      get: function(){ return ref.once("value").then(function(s){ var v = s.val(); return {id:this&&path, exists:!!v, data:function(){ try{ return JSON.parse(v); }catch(e){ return undefined; } }, metadata:{fromCache:false, hasPendingWrites:false}}; }); },
      set: function(obj){ if(!ref) return Promise.reject({code:"invalid_argument", message:"Unknown path"});
        return ref.set(JSON.stringify(obj)).catch(function(e){ throw {code:"invalid_argument", message:(e&&e.message)||"Not allowed"}; }); },
      onSnapshot: function(next, err){ if(!ref){ if(err) err({code:"invalid_argument", message:"Unknown path"}); return function(){}; }
        var cb = function(s){ var v = s.val(); next({id:path.split("/").pop(), exists:!!v, data:function(){ try{ return JSON.parse(v); }catch(e){ return undefined; } }, metadata:{fromCache:false, hasPendingWrites:false}}); };
        ref.on("value", cb, function(e){ if(err) err({code:"revoked", message:String(e&&e.message||e)}); });
        return function(){ ref.off("value", cb); }; }
    }; },
  collection: function(name){
    var q = {field:null, dir:"asc", n:1000};
    var api = {
      orderBy: function(f, d){ q.field = f; q.dir = d||"asc"; return api; },
      limit: function(n){ q.n = n; return api; },
      where: function(){ return api; },
      get: function(){ if(name !== "races") return Promise.resolve({docs:[], size:0, empty:true});
        return G.child("races").once("value").then(function(s){ var v = s.val() || {}, rows = [];
          Object.keys(v).forEach(function(id){ try{ rows.push({id:id, d:JSON.parse(v[id])}); }catch(e){} });
          if(q.field) rows.sort(function(a,b){ var x = a.d[q.field]||0, y = b.d[q.field]||0; return q.dir==="desc" ? y-x : x-y; });
          rows = rows.slice(0, q.n);
          var docs = rows.map(function(r){ return {id:r.id, exists:true, data:function(){ return r.d; }}; });
          return {docs:docs, size:docs.length, empty:!docs.length}; }); }
    };
    return api; }
};
var caps = {room:room, user:user, db:db};
window.claude = {
  hot: hot,
  use: function(name){
    if(!caps[name]) return Promise.resolve(null);
    return withTimeout(start(), 20000).then(function(){ return caps[name]; }, function(e){ window.__LIVE_ERR = (e && e.message) || window.__LIVE_ERR; return null; });
  }
};

/* ---------- one-time setup screen for the teacher ---------- */
function showSetup(){
  var cur = LS.get("gm-fbcfg");
  var wrap = document.createElement("div");
  wrap.id = "gmSetup";
  wrap.innerHTML =
  '<div class="setupcard card">'+
   '<div class="eyebrow"><span class="flag"></span>Teacher setup · one time only</div>'+
   '<h1 class="rainbow">Connect your live class</h1>'+

function collect(){if(!roomOK||!isHost||H.state==="lobby")return;
  const now=Date.now(),seen=new Set();H.results=H.results||{};
  room.peers().forEach(p=>{const pr=p.presence;if(p.sameTab||!pr||pr.role!=="player"||pr.gid!==H.gid||typeof pr.name!=="string")return;
    seen.add(p.peer);const r=H.results[p.peer]||{};
    Object.assign(r,{name:pr.name.slice(0,20),q:+pr.q||0,score:+pr.score||0,tries:+pr.tries||0,first:+pr.first||0,rev:+pr.rev||0,bs:+pr.bs||0,
      wrongs:Array.isArray(pr.wrongs)?pr.wrongs.slice(0,N).map(x=>+x||0):Array(N).fill(0),
      wp:Array.isArray(pr.wp)?pr.wp.slice(0,N).map(a=>Array.isArray(a)?a.slice(0,12).map(x=>+x||0):[]):[],
      done:!!pr.done,online:true});
    if(r.done&&!r.finishAt)r.finishAt=now;
    H.results[p.peer]=r});
  Object.entries(H.results).forEach(([k,r])=>{if(!seen.has(k))r.online=false});
  scheduleSave();
}
function resultsList(){return Object.entries(H.results||{}).map(([peer,r])=>Object.assign({peer},r))}
function rankSort(a,b){return b.score-a.score||(b.done-a.done)||((a.finishAt||9e15)-(b.finishAt||9e15))||b.first-a.first}
function snapshotRace(){return {gid:H.gid,startedAt:H.startedAt||null,endedAt:H.state==="ended"?(H.endedAt||Date.now()):null,
  qs:Q.map(q=>({text:q.text,tag:q.tag||"",opts:q.opts,a:q.a,sec:q.sec,rule:q.rule,type:q.type||"",fix:q.fix||""})),secs:SECTIONS.map(x=>({name:x.name,short:x.short,start:x.start,end:x.end})),
  results:resultsList().map(r=>({name:r.name,score:r.score,first:r.first,q:r.q,done:r.done,finishAt:r.finishAt||null,bs:r.bs||0,wrongs:r.wrongs,wp:r.wp})).sort(rankSort)}}
let saveT=null,savingRace=false,saveAgain=false;
function scheduleSave(){if(!db||!isHost||!H.gid||H.state==="lobby"||!Object.keys(H.results||{}).length)return;clearTimeout(saveT);saveT=setTimeout(saveRace,8000)}
async function saveRace(){clearTimeout(saveT);if(!db||!Object.keys(H.results||{}).length)return;
  if(savingRace){saveAgain=true;return}savingRace=true;
  try{await db.doc("races/"+H.gid).set(snapshotRace())}catch(e){}
  savingRace=false;if(saveAgain){saveAgain=false;saveRace()}}

function validate(){const errs=[];let n=0;

    if(filled<2)errs.push(`Q${n} needs at least 2 answers`);
    else if(q.opts.some(o=>!o.trim()))errs.push(`Q${n} has an empty answer box`);
    if(!q.opts[q.a]||!q.opts[q.a].trim())errs.push(isFix(q)?`Q${n}: tick the part with the mistake`:`Q${n} has no correct answer ticked`);
    if(isFix(q)&&!(q.fix||"").trim())errs.push(`Q${n} needs the correction`)})});
  if(!n)errs.push("add at least one question");
  return errs}

  const wr=Array.from({length:L.length},(_,i)=>PV.wrongs[i]||0);
  app.innerHTML=`<div class="pvbar"><span class="chip warn">Teacher preview · this is the student's end screen</span><div class="row" style="margin-left:auto"><button class="mini" id="pvAgain">↺ Preview again</button><button class="mini" id="pvBack">← Back to editor</button></div></div>`+
   doneHTML({name:"Student",score:PV.score,first:PV.first,wrongs:wr,wp:PV.wp,best:PV.best,qs:L,secs,rankHTML:rankHTML(null,true),buttons:`<button class="btn ghost" disabled>Race again</button>`});
  startDoneFx(PV.score);
  $("#pvBack").onclick=()=>{H.view="editor";render()};$("#pvAgain").onclick=()=>openPreview(0)}
/* ---------- router ---------- */
let teacherTimer=null;
function render(){
  if(isHost&&H.view==="tpreviewEnd"){if(!E)E=clone(DATA);return renderPreviewEnd()}
  if(isHost&&H.view==="tpreview"){if(!E)E=clone(DATA);return renderPreview()}
  if(isHost&&H.view==="editor"){if(!E)E=clone(DATA);return renderEditor()}
  if(isHost&&H.view==="past")return renderPast();
  if(isHost&&H.view==="teacher")return renderTeacher();
  if(S.phase==="join")return renderJoin();
  if(S.phase==="wait")return renderWait();
  if(S.phase==="play")return renderPlay();
  if(S.phase==="done")return renderDone();
}

function onGame(g){ if(!g||typeof g.gid!=="string")return; const prev=hostSeen; hostSeen={gid:g.gid,state:g.state,units:Array.isArray(g.units)?g.units.filter(Number.isInteger).slice(0,20):[]};
  if(isHost&&H.view!=="student")return;
  if(g.state==="live"&&S.phase==="wait"){S.gid=g.gid;toast("Go go go!");tone([[440,.15],[440,.15],[880,.4]]);startPlay(hostSeen.units);return}
  if(g.state==="live"&&S.gid&&S.gid!==g.gid&&S.phase!=="join"){S.gid=g.gid;startPlay(hostSeen.units);return}
  if(g.state==="lobby"&&prev&&prev.gid!==g.gid&&S.phase!=="join"){S.gid=null;S.phase="wait";pushPresence();render();return}
  if(S.phase==="wait"||S.phase==="join")render();
}

async function boot(saved){
  if(saved&&saved.S)S=Object.assign(S,saved.S);
  if(!Array.isArray(S.pick))S.pick=[];
  if(saved&&saved.H)H=Object.assign(H,saved.H);
  if(saved&&saved.E){E=saved.E;dirty=!!saved.dirty}
  if(saved&&saved.P)P=saved.P;
  if(S.phase!=="join"&&Array.isArray(S.units)&&S.units.length){setUnits(S.units);applyData(DATA)}
  if(H.view!=="student"&&H.state!=="lobby"&&Array.isArray(H.units)&&H.units.length){setUnits(H.units);applyData(DATA)}
  if(saved&&saved.PV)PV=saved.PV;
  render();
  try{ [room,user,db]=await Promise.all(["room","user","db"].map(n=>window.claude?claude.use(n).catch(()=>null):null)); }catch(e){}
  if(db){ db.doc("quiz/questions").onSnapshot(snap=>{
      const d=snap.exists?cleanData(snap.data()):null; const next=d||DEFAULT_DATA;
      if(JSON.stringify(next)===JSON.stringify(DATA))return;
      if(S.phase==="play"&&H.view==="student"){pendingData=next;return}
      applyData(next); if(H.view==="editor"&&!dirty)E=clone(next);
      if(!((H.view==="editor"||H.view==="tpreview")&&dirty))render();
    },()=>{}); }
  isHost = user ? await user.canEdit() : false;
  if(room){
    roomOK=true;
    room.onConnection(()=>{},()=>{roomOK=false;render()});
    room.on("game",m=>onGame(m.data),()=>{});
    room.onPeers(ch=>{
      if(isHost&&H.state!=="lobby")collect();
      if(isHost&&H.view==="teacher"){ if(ch.joined.length)broadcast(); clearTimeout(teacherTimer);teacherTimer=setTimeout(render,120); }
      else if(isHost&&H.view!=="student"){ if(ch.joined.length)broadcast(); }
      else if(!isHost||H.view==="student"){if(S.phase==="wait")render();else if(S.phase==="done")refreshRank();}
    },()=>{roomOK=false;render()});
  }
  if(isHost){ if(!H.gid)H.gid="g"+Math.random().toString(36).slice(2,8); setInterval(broadcast,4000); setTimeout(broadcast,800); }
  if(S.phase!=="join")pushPresence();
  render();
}
window.claude?.hot?.snapshot?.(()=>({S,H,E,dirty,P,PV}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
